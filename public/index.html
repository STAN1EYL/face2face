<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face2Face — AI Negotiation Coach</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- 內嵌 favicon：避免瀏覽器對 /favicon.ico 發出 404 請求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="container">
    <header>
      <h1>Face2Face</h1>
      <p class="subtitle">AI Negotiation Coach</p>
    </header>

    <main>
      <section class="stage-row">
        <div class="avatar-section">
          <div class="presenter-stage">
            <sv-presenter id="presenter" style="width: 100%; height: 420px;"></sv-presenter>
            <div class="launch-overlay" id="launchOverlay">
              <button type="button" id="launchBtn" disabled>準備中...</button>
              <p class="launch-hint">瀏覽器需要一次點擊才能解鎖語音播放</p>
            </div>
          </div>
          <div class="status" id="status">載入中...</div>
        </div>

        <aside class="scenario-panel">
          <h2 id="scenarioTitle">場景</h2>
          <div id="briefing" class="briefing">
            <p>啟動 Avatar 後即可開始談判。</p>
          </div>

          <dl class="stats" id="stats" hidden>
            <div class="stat"><dt>回合</dt><dd id="statRound">—</dd></div>
            <div class="stat highlight"><dt>目前 Offer</dt><dd id="statOffer">—</dd></div>
            <div class="stat"><dt>你的目標</dt><dd id="statTarget">—</dd></div>
            <div class="stat"><dt>你的底線</dt><dd id="statFloor">—</dd></div>
          </dl>

          <div class="panel-actions">
            <label class="scenario-select">
              <span>談判情境</span>
              <select id="scenarioSelect" disabled>
                <option value="">載入中...</option>
              </select>
            </label>
            <form class="custom-form" id="customForm" hidden>
              <label>你的身分<input type="text" id="cfRole" maxlength="40" placeholder="例如：買方" required></label>
              <label>對方身分<input type="text" id="cfAvatarRole" maxlength="40" placeholder="例如：房仲" required></label>
              <label>方向
                <select id="cfDirection">
                  <option value="up">我要爭取更高的金額</option>
                  <option value="down">我要把價格壓低</option>
                </select>
              </label>
              <label>情境說明<textarea id="cfContext" maxlength="200" rows="2" placeholder="對方是誰、你為什麼在談這件事" required></textarea></label>
              <label>對方開價<input type="number" id="cfInitial" min="1" step="1000" required></label>
              <label>你的目標<input type="number" id="cfTarget" min="1" step="1000" required></label>
              <label>你的底線<input type="number" id="cfFloor" min="1" step="1000" required></label>
              <label>回合數<input type="number" id="cfRounds" min="3" max="10" value="6"></label>
              <p class="custom-hint" id="customHint">對方的讓步空間由系統決定，你不會知道確切底價。</p>
            </form>
            <button type="button" id="startBtn" disabled>開始談判</button>
            <button type="button" id="testSpeechBtn" class="ghost" disabled>🔊 測試固定語句</button>
          </div>
        </aside>
      </section>

      <section class="chat-section">
        <div class="messages" id="messages">
          <div class="message bot">
            <div class="message-content">歡迎使用 Face2Face。先啟動 Avatar，再開始這場薪資談判。</div>
          </div>
        </div>

        <form class="input-form" id="chatForm">
          <input type="text" id="userInput" placeholder="輸入你的回應..." autocomplete="off" disabled required>
          <button type="submit" id="sendBtn" disabled>送出</button>
        </form>
      </section>

      <section class="report-section" id="reportSection" hidden>
        <h2>談判結果</h2>
        <div id="reportBody"></div>
      </section>
    </main>
  </div>

  <script src="/js/app.js" type="module"></script>
</body>
</html>
